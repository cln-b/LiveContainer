name: Xcode - Build

on: 
  push:
  pull_request:
  workflow_dispatch:
    inputs: 
      release__nightly:
        description: Create a nightly release
        type: boolean
        required: false

jobs:
  build:
    name: Build using xcodebuild command
    runs-on: macos-latest
    env:
      scheme: LiveContainer
      archive_path: archive
    outputs:
      scheme: ${{ steps.scheme.outputs.scheme }}
      archive_path: ${{ env.archive_path }}
      artifact: ${{ env.scheme }}.ipa
      artifact2: ${{ env.scheme }}+SideStore.ipa
      sidestore_build_tag: ${{ steps.sidestore.outputs.build_tag }}
      sidestore_sha: ${{ steps.sidestore.outputs.sha }}
      sidestore_msg: ${{ steps.sidestore.outputs.msg }}
      release_title: ${{ steps.meta.outputs.release_title }}
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'
      - name: Checkout LiveContainer
        uses: actions/checkout@v6
        with:
          repository: LiveContainer/LiveContainer
          submodules: recursive
      - name: Get SideStore details
        id: sidestore
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REL_JSON=$(curl -fsSL -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            https://api.github.com/repos/SideStore/SideStore/releases/tags/nightly)

          SS_FULL_VERSION=$(echo "$REL_JSON" | jq -r '.body' | grep -oE 'Version: `([^`]+)`' | sed -E 's/Version: `([^`]+)`/\1/')
          BUILD_TAG=$(echo "$SS_FULL_VERSION" | sed -E 's/.*-([0-9]+\.[0-9]+)\+.*/\1/')

          if [ -z "$BUILD_TAG" ]; then
            echo "Failed to determine SideStore build tag"
            exit 1
          fi

          TARGET_TAG=$(echo "$REL_JSON" | jq -r '.tag_name')
          COMMIT_JSON=$(curl -fsSL -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            https://api.github.com/repos/SideStore/SideStore/commits/"$TARGET_TAG")

          SS_SHA=$(echo "$COMMIT_JSON" | jq -r '.sha')
          SS_MSG=$(echo "$COMMIT_JSON" | jq -r '.commit.message' | head -n 1)

          echo "build_tag=$BUILD_TAG" >> "$GITHUB_OUTPUT"
          echo "full_version=$SS_FULL_VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SS_SHA" >> "$GITHUB_OUTPUT"
          echo "msg=$SS_MSG" >> "$GITHUB_OUTPUT"

      - name: Generate Release Title
        id: meta
        run: |
          LC_VERSION=$(plutil -extract CFBundleVersion raw -o - LiveContainer/Info.plist)
          LC_SHORT_SHA=$(git rev-parse --short=8 HEAD)

          echo "release_title=LC ${LC_VERSION} (main/${LC_SHORT_SHA}), SS ${{ steps.sidestore.outputs.full_version }}" >> "$GITHUB_OUTPUT"

      - name: Set Scheme
        id: scheme
        run: |
          if [ $scheme = default ]
          then
            scheme_list=$(xcodebuild -list -json | tr -d "\n")
            scheme=$(echo $scheme_list | ruby -e "require 'json'; puts JSON.parse(STDIN.gets)['project']['targets'][0]")
            echo Using default scheme: $scheme
          else
            echo Using configured scheme: $scheme
          fi
          echo "scheme=$scheme" >> $GITHUB_OUTPUT
      - name: Set filetype_parameter
        id: filetype_parameter
        run: |
          filetype_parameter=`ls -A | grep -i \\.xcworkspace\$ && echo workspace || echo project`
          echo "filetype_parameter=$filetype_parameter" >> $GITHUB_OUTPUT
      - name: Set file_to_build
        id: file_to_build
        run: |
          file_to_build=`ls -A | grep -i \\.xcworkspace\$ || ls -A | grep -i \\.xcodeproj\$`
          file_to_build=`echo $file_to_build | awk '{$1=$1;print}'`
          echo "file_to_build=$file_to_build" >> $GITHUB_OUTPUT
      - name: Archive
        env:
          scheme: ${{ steps.scheme.outputs.scheme }}
          filetype_parameter: ${{ steps.filetype_parameter.outputs.filetype_parameter }}
          file_to_build: ${{ steps.file_to_build.outputs.file_to_build }}
        run: xcodebuild archive -archivePath "$archive_path" -scheme "$scheme" -"$filetype_parameter" "$file_to_build" -sdk iphoneos -arch arm64 -configuration Release | xcpretty && exit ${PIPESTATUS[0]}
      - name: Tar Build Artifact
        run: tar -cvf "$archive_path.xcarchive.tar" "$archive_path.xcarchive"
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.archive_path }}.xcarchive.tar
          path: ${{ env.archive_path }}.xcarchive.tar
      - name: Create IPA
        run: |
          sh .github/build_github.sh

      - name: Upload LiveContainer IPA
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.scheme }}.ipa
          path: ${{ env.scheme }}.ipa
      
      - name: Upload LiveContainer+SideStore IPA
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.scheme }}+SideStore.ipa
          path: ${{ env.scheme }}+SideStore.ipa

  release__nightly:
    name: Nightly Release
    permissions:
      contents: write
    if: inputs.release__nightly || github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    needs: [build]
    concurrency:
      group: release__nightly
      cancel-in-progress: true

    steps:
      - name: Checkout LiveContainer Source
        uses: actions/checkout@v3
        with:
          repository: LiveContainer/LiveContainer
      - name: Download a Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}
      - name: Download a Build Artifact2
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact2 }}
      - name: Get Commit Info
        id: commit_info
        run: |
          LC_SHA=$(git rev-parse HEAD)
          LC_MSG=$(git log -1 --pretty=%s)
          echo "LC_SHA=$LC_SHA" >> $GITHUB_ENV
          echo "LC_MSG=$LC_MSG" >> $GITHUB_ENV
      - name: Patch update_json.py and JSON URLs to target this dummy repo
        run: |
          sed -i 's|repo_url = "LiveContainer/LiveContainer"|repo_url = os.environ["GITHUB_REPOSITORY"]|' .github/update_json.py
          sed -i 's|https://github.com/LiveContainer/LiveContainer|${{ github.server_url }}/${{ github.repository }}|g' .github/update_json.py
      - name: Update AltStore source
        id: update_source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIGHTLY_LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          commit_sha: ${{ env.LC_SHA }}
          commit_msg: ${{ env.LC_MSG }}
        run: |
          sed -i 's|repo_url = "LiveContainer/LiveContainer"|repo_url = os.environ["GITHUB_REPOSITORY"]|g' .github/update_json.py
          sed -i 's|LiveContainer.ipa|LiveContainer+SideStore.ipa|g' .github/update_json.py

          # 3. Read apps_ss_lc.json from the local .github folder instead of fetching over HTTP
          sed -i 's|https://github.com/.*apps_ss_lc.json|.github/apps_ss_lc.json|g' .github/update_json.py

          # 4. Run the script
          python .github/update_json.py
      - name: Nightly Release
        uses: andelf/nightly-release@5834076edc55cc05975561c9722043f072ac5c26
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with: 
          body: |
            **LiveContainer Commit:** [${{ env.LC_SHA }}](https://github.com/LiveContainer/LiveContainer/commit/${{ env.LC_SHA }})
            **Message:** ${{ env.LC_MSG }}

            **SideStore Commit:** [${{ needs.build.outputs.sidestore_sha }}](https://github.com/SideStore/SideStore/commit/${{ needs.build.outputs.sidestore_sha }})
            **Message:** ${{ needs.build.outputs.sidestore_msg }}
          files: |
            ${{ needs.build.outputs.artifact2 }}
            .github/apps_nightly.json
      - name: Nightly Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.build.outputs.sidestore_build_tag }}
          name: ${{ needs.build.outputs.release_title }}
          make_latest: true
          prerelease: false
          body: |
            **LiveContainer Commit:** [${{ env.LC_SHA }}](https://github.com/LiveContainer/LiveContainer/commit/${{ env.LC_SHA }})
            **Message:** ${{ env.LC_MSG }}

            **SideStore Commit:** [${{ needs.build.outputs.sidestore_sha }}](https://github.com/SideStore/SideStore/commit/${{ needs.build.outputs.sidestore_sha }})
            **Message:** ${{ needs.build.outputs.sidestore_msg }}
          files: |
            ${{ needs.build.outputs.artifact2 }}
      - name: Update apps.json in Release 1.0
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "1.0"
          files: |
            .github/apps_ss_lc.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
